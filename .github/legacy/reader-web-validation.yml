name: reader-web validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Compose syntax
        run: |
          cp .env.example .env
          docker compose config
      - name: Build image
        run: docker build --tag reader-web:ci .