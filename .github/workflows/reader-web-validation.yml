name: reader-web validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Compose syntax and default deployment contract
        run: |
          cp .env.example .env
          docker compose config > compose.rendered.yml
          docker compose config --services | grep -qx reader
          ! grep -Eq '(^|[[:space:]])caddy:' compose.rendered.yml
          ! grep -Eq '"?(80|443):(80|443)"?' compose.rendered.yml
          grep -Fq 'host_ip: 0.0.0.0' compose.rendered.yml
          grep -Eq 'published: .*6788' compose.rendered.yml
          grep -Fq 'target: 6788' compose.rendered.yml
          grep -Fq 'reader-web-reader-data' compose.rendered.yml
          grep -Fq 'reader-web-reader-data' scripts/update-debian.sh
          grep -Fq 'reader-web-reader-data' scripts/rollback-debian.sh
      - name: Build image
        run: docker build --tag reader-web:ci .
      - name: Start default deployment and verify health checks
        run: |
          cp .env.example .env
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if docker compose exec -T reader wget -q -O - http://127.0.0.1:6788/health | grep -q ok; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo 'reader internal /health did not become ready' >&2
              exit 1
            fi
            sleep 2
          done
          curl --fail --retry 15 --retry-delay 2 http://127.0.0.1:6788/health | grep -q ok
      - name: Show container diagnostics
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
