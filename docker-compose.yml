name: reader-web

services:
  reader:
    build: .
    image: reader-web:local
    restart: unless-stopped
    ports:
      - "${READER_HOST_BIND:-0.0.0.0}:${READER_HOST_PORT:-6788}:6788"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      READER_SERVER_PORT: "6788"
      READER_APP_STORAGEPATH: /data/storage
      READER_APP_SECURE: "true"
      READER_APP_SECUREKEY: ${READER_ADMIN_PASSWORD:?set READER_ADMIN_PASSWORD}
      READER_APP_INVITECODE: ${READER_INVITE_CODE:?set READER_INVITE_CODE}
      READER_APP_CACHECHAPTERCONTENT: "true"
    volumes:
      - reader-data:/data
      - reader-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:6788/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  reader-data:
    name: reader-web-reader-data
  reader-logs:
    name: reader-web-reader-logs
